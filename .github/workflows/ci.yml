name: skeleton-ci
on: [push, pull_request]
jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build default targets
        run: cmake --build build
      - name: Compile every exercise target
        shell: bash
        run: |
          set -eo pipefail
          cmake --build build --target help | awk '/test_.*_bin$/ {print $2}' | while read -r target; do
            echo "Compiling ${target}"
            cmake --build build --target "${target}"
          done
      - name: Run repository sanity test
        run: ctest --test-dir build -R '^repo_sanity$' --output-on-failure
      - name: Check forbidden STL shortcuts
        run: python3 scripts/check_no_stl.py
