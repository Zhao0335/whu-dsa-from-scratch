name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - run: python3 scripts/check_no_stl.py
